<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platin Multiplayer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="stage">
      <canvas id="game" width="720" height="528"></canvas>
      <div id="fade"></div>
      <div id="mapName" class="banner hidden"></div>
      <div id="dialog" class="dialog hidden"></div>

      <section id="battle" class="hidden">
        <div class="field">
          <div id="foeBox" class="infobox foe"></div>
          <div id="trainerSprite" class="trainer-sprite hidden"></div>
          <div id="foeSprite" class="mon-sprite foe"></div>
          <div id="allySprite" class="mon-sprite ally"></div>
          <div id="allyBox" class="infobox ally"></div>
        </div>
        <div class="bottom">
          <div id="battleText" class="battle-text"></div>
          <div id="battleMenu" class="battle-menu"></div>
        </div>
      </section>

      <section id="login" class="modal">
        <div class="panel">
          <h1>Pokemon Platin <small>Multiplayer</small></h1>
          <label>Trainername <input id="loginName" maxlength="16" autocomplete="off"></label>
          <label>Run-Code (leer = Solo) <input id="loginRun" maxlength="12" placeholder="z. B. SOUL1" autocomplete="off"></label>
          <fieldset id="ruleSet">
            <legend>Regeln (nur beim Erstellen eines neuen Runs)</legend>
            <label><input type="checkbox" data-rule="nuzlocke" checked> Nuzlocke (Permadeath, 1 Fang pro Route)</label>
            <label><input type="checkbox" data-rule="soulbound" checked> Linked Soulbound</label>
            <label><input type="checkbox" data-rule="dupesClause" checked> Dupes Clause</label>
            <label><input type="checkbox" data-rule="shinyClause" checked> Shiny Clause</label>
            <label><input type="checkbox" data-rule="failedEncounterBreaksLink" checked> Gescheiterter Encounter bricht Seelenband</label>
          </fieldset>
          <button id="loginBtn">Spielen</button>
          <p id="loginSaved" class="hint"></p>
          <p id="loginError" class="error"></p>
        </div>
      </section>

      <section id="modal" class="modal hidden"><div class="panel" id="modalPanel"></div></section>

      <section id="worldmap" class="hidden">
        <div class="wm-head"><b>Karte von Sinnoh</b><span id="wmInfo"></span>
          <span class="wm-btns"><button id="wmIn" title="Hineinzoomen (+)">+</button><button id="wmOut" title="Herauszoomen (-)">−</button><button id="wmHome" title="Zu mir">⌂</button><button id="wmClose" title="Schließen (M)">✕</button></span></div>
        <canvas id="wmCanvas"></canvas>
        <div id="wmList" class="wm-list"></div>
        <div class="wm-foot" id="wmFoot">Mausrad oder +/−: Zoom · Ziehen: verschieben · M oder Esc: schließen</div>
      </section>
    </main>

    <aside id="hud">
      <div class="tabs">
        <button data-tab="party" class="active">Team</button>
        <button data-tab="bag">Beutel</button>
        <button data-tab="nuzlocke">Nuzlocke</button>
        <button data-tab="links">Seelenband</button>
        <button data-tab="box">Box</button>
      </div>
      <div class="mini"><canvas id="minimap" width="306" height="112"></canvas><span id="miniLabel"></span><button id="mapBtn" title="Weltkarte (M)">Karte</button></div>
      <div id="trainerCard" class="trainer-card"></div>
      <div id="tab-party" class="tab"></div>
      <div id="tab-bag" class="tab hidden"></div>
      <div id="tab-nuzlocke" class="tab hidden"></div>
      <div id="tab-links" class="tab hidden"></div>
      <div id="tab-box" class="tab hidden"></div>
      <div class="toggles">
        <button id="logBtn" class="tg" title="Verlauf ein- und ausklappen">Verlauf<i id="logBadge" class="hidden"></i></button>
        <button id="musicBtn" class="tg" title="Musik an/aus (N)">♪ Musik</button>
        <button id="sfxBtn" class="tg" title="Effekte an/aus">Effekte</button>
        <button id="setBtn" class="tg" title="Lautstärke und Tasten">⚙</button>
      </div>
      <div id="log" class="log hidden"></div>
      <div id="setPanel" class="settings hidden">
        <div class="volumes"><label>Musik <input id="musicVol" type="range" min="0" max="100"></label><label>Effekte <input id="sfxVol" type="range" min="0" max="100"></label></div>
        <div class="help">Pfeiltasten/WASD: Laufen · Shift: Rennen · Z/Enter: Interagieren · T: Chat · M: Karte · 1 bis 6: Emotes · N: Musik an/aus</div>
      </div>
      <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Chat (T)"></form>
      <div class="toolbar"><div id="emoteBar" class="emotes"></div><span class="online">Online: <b id="onlineCount">0</b></span></div>
    </aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
